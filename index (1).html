<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TTK Music">
<title>TTK Music</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1e6bff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eaf2ff;--fg:#0b1a33;--mut:#5d7194;--acc:#1e6bff;--card:rgba(255,255,255,.3);--line:rgba(255,255,255,.6);--glass:rgba(255,255,255,.16);--gl:rgba(255,255,255,.75);--g1:rgba(255,255,255,.5);--g2:rgba(255,255,255,.1);--p1:#1e6bff;--p2:#00cdff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060d1f;--fg:#eaf1ff;--mut:#8ea3c7;--acc:#4a8bff;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.07);--gl:rgba(255,255,255,.3);--g1:rgba(255,255,255,.16);--g2:rgba(255,255,255,.03);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#060d1f;--fg:#eaf1ff;--mut:#8ea3c7;--acc:#4a8bff;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.14);--glass:rgba(255,255,255,.07);--gl:rgba(255,255,255,.3);--g1:rgba(255,255,255,.16);--g2:rgba(255,255,255,.03);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}html,body{margin:0;color:var(--fg);font:16px/1.4 "Sora",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body{min-height:100vh;background:radial-gradient(60vmax 50vmax at 10% 0%,color-mix(in srgb,var(--p1) 42%,transparent),transparent 60%),radial-gradient(55vmax 45vmax at 100% 30%,color-mix(in srgb,var(--p2) 34%,transparent),transparent 60%),radial-gradient(60vmax 50vmax at 20% 100%,color-mix(in srgb,var(--p1) 30%,transparent),transparent 60%),var(--bg);background-attachment:fixed}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
main{max-width:720px;margin:0 auto;padding:16px 20px 190px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;margin:8px 0 16px}
h2{font-size:21px;font-weight:650;letter-spacing:-.01em;margin:26px 0 12px}
.mut,.t span{color:var(--mut)}
.glass,.row,.seg,.q,.btn.alt{background:linear-gradient(135deg,var(--g1),var(--g2) 45%,var(--g1));-webkit-backdrop-filter:blur(14px) saturate(210%) brightness(1.06);backdrop-filter:blur(14px) saturate(210%) brightness(1.06);border:1px solid var(--gl);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),inset 0 -1px 0 rgba(255,255,255,.2),0 12px 34px rgba(30,80,200,.2)}
.sq,.ci,.ph{object-fit:cover;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.sq{border-radius:16px;box-shadow:0 8px 22px rgba(30,80,200,.25),inset 0 0 0 1px rgba(255,255,255,.6)}.ci{border-radius:50%;box-shadow:0 8px 22px rgba(30,80,200,.25),inset 0 0 0 1px rgba(255,255,255,.6)}
.s44{width:46px;height:46px;font-size:18px}.s100{width:100px;height:100px;font-size:34px}.s140{width:140px;height:140px;font-size:46px}
.row{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 10px;margin-bottom:10px;border-radius:22px;cursor:pointer}
.t{flex:1;min-width:0;display:flex;flex-direction:column}.t b,.t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t span{font-size:14px}
.dots{color:var(--mut);padding:8px;letter-spacing:1px}
.hrow{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hrow::-webkit-scrollbar{display:none}
.card{width:140px;flex:none;cursor:pointer}.card .t{margin-top:8px}.card.a{width:100px;text-align:center}.card.a .t{align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px}.grid .card{width:auto}.grid .s140{width:100%;height:auto;aspect-ratio:1}
.btn{background:linear-gradient(180deg,#4f90ff,#1e6bff);color:#fff;border-radius:16px;padding:11px 18px;font-weight:600;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 8px 20px rgba(30,107,255,.38)}.btn.sm{padding:7px 14px;font-size:14px}.btn.alt{color:var(--acc)}
.empty{text-align:center;padding:60px 10px}.empty p{color:var(--mut);margin-bottom:18px}
.back{color:var(--acc);font-size:17px;padding:6px 0}
.hd{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;margin:8px 0 6px}.hd h1{margin:0}
.story{white-space:pre-wrap;color:var(--mut);max-width:60ch}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.seg{display:flex;border-radius:16px;padding:4px;margin-bottom:16px}.seg button{flex:1;padding:8px;border-radius:12px;font-size:13px;font-weight:600;color:var(--mut)}.seg .on{background:rgba(255,255,255,.65);color:var(--acc);box-shadow:inset 0 1px 0 #fff,0 3px 10px rgba(30,80,200,.2)}
.q{width:100%;padding:13px 18px;border-radius:20px;color:var(--fg);font:inherit;margin-bottom:8px;outline:0}
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:min(330px,82vw);height:64px;border-radius:34px;padding:5px;gap:4px;display:flex;z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mut);font-weight:600}
#tabs button.on{color:var(--acc);background:rgba(255,255,255,.5);border-radius:28px;box-shadow:inset 0 1px 0 #fff,0 4px 12px rgba(30,80,200,.2)}#tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mini{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);max-width:696px;margin:0 auto;height:66px;border-radius:26px;display:flex;align-items:center;gap:12px;padding:8px 12px;z-index:20;cursor:pointer}
#mini[hidden]{display:none}#mini{border-color:color-mix(in srgb,var(--p1) 55%,white);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),0 10px 36px color-mix(in srgb,var(--p1) 50%,transparent)}#mini .t{flex:1}.ico{width:40px;height:40px;display:grid;place-items:center;font-size:20px}
#full{position:fixed;inset:0;z-index:30;background:radial-gradient(80vmax 60vmax at 15% 0%,color-mix(in srgb,var(--p1) 55%,transparent),transparent 60%),radial-gradient(70vmax 60vmax at 95% 100%,color-mix(in srgb,var(--p2) 48%,transparent),transparent 60%),var(--bg);transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 24px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:hidden}
#full.open{transform:none}#full>*{width:100%;max-width:420px}
.grab{width:44px!important;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px;flex:none;display:block}
#cv{margin:10px auto;width:min(56vw,230px);aspect-ratio:1;border-radius:16px;box-shadow:0 0 calc(18px + var(--b,0)*55px) color-mix(in srgb,var(--p1) calc(25% + var(--b,0)*65%),transparent);transform:scale(calc(1 + var(--b,0)*.07));transition:transform .06s,box-shadow .06s;overflow:hidden;flex:none}
#cv>*{width:100%;height:100%;border-radius:0;font-size:80px}
#full h3{margin:6px 0 0;font-size:21px;text-align:center}#full .by{text-align:center;color:var(--mut);margin:0}
#bars{height:38px;margin:8px 0 2px;flex:none;display:block}
#seek{width:100%;accent-color:var(--p1);flex:none}.times{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);flex:none}
.ctl{display:flex;justify-content:center;align-items:center;gap:30px;font-size:30px;flex:none;margin:4px 0}.ctl .big{font-size:42px;color:var(--acc)}
#ly{flex:1;overflow-y:auto;position:relative;margin-top:8px;text-align:center;font-size:20px;font-weight:600;line-height:1.4;scrollbar-width:none;padding:30% 0}
#ly div{padding:6px 0;color:var(--mut);opacity:.55;transition:all .25s;cursor:pointer}#ly div.on{color:var(--fg);opacity:1;transform:scale(1.04)}
#modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}#modal.open{display:flex}
.sheet{background:color-mix(in srgb,var(--bg) 70%,transparent);-webkit-backdrop-filter:blur(26px) saturate(200%);backdrop-filter:blur(26px) saturate(200%);border-top:1px solid var(--gl);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px)}
.sheet label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px 12px;border-radius:10px;border:0;background:var(--card);color:var(--fg);font:inherit}.sheet textarea{min-height:130px}
.sheet .acts{margin-top:18px;justify-content:space-between}.del{color:#e5352b;font-weight:600}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translate(-50%,-90px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:60;transition:transform .3s;font-size:14px}#toast.show{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#cv{transform:none!important}#full{transition:none}}

@property --p1{syntax:"<color>";inherits:true;initial-value:#1e6bff}
@property --p2{syntax:"<color>";inherits:true;initial-value:#00cdff}
:root{transition:--p1 1.4s ease,--p2 1.4s ease}
#tray{perspective:800px;flex:1;min-height:150px;display:flex;align-items:center;margin-top:8px}
.prism{position:relative;width:100%;height:100%;min-height:140px;max-height:230px;border-radius:28px;transform-style:preserve-3d;overflow:hidden}
.face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 22px;text-align:center;font-size:21px;font-weight:700;line-height:1.3;backface-visibility:hidden;text-shadow:0 2px 16px color-mix(in srgb,var(--p1) 60%,transparent)}
.face small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:8px;text-shadow:none}
.tbar{display:flex;gap:8px;justify-content:center;margin:8px 0 0;flex:none}
.pill{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--fg)}
.pill.on{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--p1) 70%,white),var(--p1))}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
#djb{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 64px);transform:translate(-50%,-30px);opacity:0;transition:.4s;max-width:min(420px,90vw);padding:12px 18px;border-radius:20px;z-index:55;font-size:14px;text-align:center;pointer-events:none}
#djb.show{transform:translate(-50%,0);opacity:1}
</style>
</head>
<body>
<main id="main"></main>
<div id="mini" class="glass" hidden></div>
<nav id="tabs" class="glass">
<button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/></svg>Home</button>
<button data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Search</button>
<button data-tab="library"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>Library</button>
</nav>
<div id="full"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="djb" class="glass"></div>
<audio id="au" playsinline></audio>
<input type="file" id="imp" accept="audio/*,image/*,.mp3,.m4a,.wav,.aac,.flac" multiple hidden>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const S={song:[],artist:[],album:[]};
let db=null,tab='home',nav=[],lib='songs',curList=[];
const ls={get(){try{return JSON.parse(localStorage.getItem('ttkp')||'{}')}catch{return{}}},set(o){try{localStorage.setItem('ttkp',JSON.stringify(o))}catch{}}};
const PL=ls.get();
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('ttkmusic',1);q.onupgradeneeded=()=>q.result.createObjectStore('i',{keyPath:'id'});q.onsuccess=()=>r(q.result);q.onerror=()=>j()});
const put=o=>new Promise(r=>{if(!db)return r();try{const t=db.transaction('i','readwrite');t.objectStore('i').put(o);t.oncomplete=r;t.onerror=r}catch{r()}});
const rm=id=>new Promise(r=>{if(!db)return r();const t=db.transaction('i','readwrite');t.objectStore('i').delete(id);t.oncomplete=r});
const all=()=>new Promise(r=>{if(!db)return r([]);const q=db.transaction('i').objectStore('i').getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>r([])});
const urls=new WeakMap();
const url=b=>{if(!b)return null;if(!urls.has(b))urls.set(b,URL.createObjectURL(b));return urls.get(b)};
const hue=s=>Math.abs([...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%360;
const img=(b,n,c)=>b?`<img class="${c}" src="${url(b)}" alt="">`:`<div class="${c} ph" style="background:linear-gradient(135deg,hsl(${hue(n)} 75% 72%),hsl(${(hue(n)+50)%360} 75% 56%))">${esc((n||'?')[0].toUpperCase())}</div>`;
const A=id=>S.artist.find(x=>x.id==id),AL=id=>S.album.find(x=>x.id==id);
const cov=s=>s.cover||AL(s.albumId)?.cover||A(s.artistId)?.photo||null;
const aname=s=>A(s.artistId)?.name||'Unknown artist';
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2400)};
const row=s=>`<div class="row" data-play="${s.id}">${img(cov(s),s.title,'sq s44')}<div class="t"><b>${esc(s.title)}</b><span>${esc(aname(s))}</span></div><button class="dots" data-edit="song:${s.id}" aria-label="Edit song">•••</button></div>`;
const acard=a=>`<div class="card a" data-go="artist:${a.id}">${img(a.photo,a.name,'ci s100')}<div class="t"><b>${esc(a.name)}</b></div></div>`;
const alcard=a=>`<div class="card" data-go="album:${a.id}">${img(a.cover,a.title,'sq s140')}<div class="t"><b>${esc(a.title)}</b><span>${esc(A(a.artistId)?.name||'Album')}</span></div></div>`;
const scard=s=>`<div class="card" data-play="${s.id}">${img(cov(s),s.title,'sq s140')}<div class="t"><b>${esc(s.title)}</b><span>${esc(aname(s))}</span></div></div>`;
const lastPlayed=s=>PL[s.id]||s.added||0;

function home(){
  if(!S.song.length)return`<h1>Home</h1><div class="empty"><p>Your library is empty. Add the songs you made and they show up here.</p><button class="btn" data-act="import">Add songs</button></div>`;
  const rec=[...S.song].sort((a,b)=>lastPlayed(b)-lastPlayed(a)).slice(0,12);curList=rec;
  return`<h1>Home</h1><h2>Recent</h2><div class="hrow">${rec.map(scard).join('')}</div>`+
  (S.artist.length?`<h2>Artists</h2><div class="hrow">${S.artist.map(acard).join('')}</div>`:'')+
  (S.album.length?`<h2>Albums</h2><div class="grid">${S.album.map(alcard).join('')}</div>`:'');
}
function results(q){
  q=q.trim().toLowerCase();if(!q)return'<p class="mut">Search your songs, artists and albums.</p>';
  const m=x=>x.toLowerCase().includes(q);
  const ss=S.song.filter(s=>m(s.title)||m(aname(s))||m(s.lyrics||'')),as=S.artist.filter(a=>m(a.name)),ls_=S.album.filter(a=>m(a.title));curList=ss;
  return(as.length?`<h2>Artists</h2><div class="hrow">${as.map(acard).join('')}</div>`:'')+(ls_.length?`<h2>Albums</h2><div class="grid">${ls_.map(alcard).join('')}</div>`:'')+(ss.length?`<h2>Songs</h2>${ss.map(row).join('')}`:'')||'<p class="mut">Nothing found.</p>';
}
function search(){return`<h1>Search</h1><input class="q" id="q" placeholder="Songs, artists, albums" autocomplete="off"><div id="res">${results('')}</div>`}
function library(){
  const seg=`<div class="seg">${['songs','artists','albums'].map(k=>`<button data-lib="${k}" class="${lib==k?'on':''}">${k[0].toUpperCase()+k.slice(1)}</button>`).join('')}</div>`;
  const add=`<div class="acts" style="margin-bottom:12px;justify-content:flex-start"><button class="btn sm" data-act="import">Add songs</button><button class="btn sm alt" data-act="newartist">New artist</button><button class="btn sm alt" data-act="newalbum">New album</button></div>`;
  let b='';
  if(lib=='songs'){curList=[...S.song].sort((a,b)=>b.added-a.added);b=curList.map(row).join('')||'<p class="mut">No songs yet.</p>'}
  if(lib=='artists')b=`<div class="grid">${S.artist.map(acard).join('')||'<p class="mut">No artists yet.</p>'}</div>`;
  if(lib=='albums')b=`<div class="grid">${S.album.map(alcard).join('')||'<p class="mut">No albums yet.</p>'}</div>`;
  return`<h1>Library</h1>${seg}${add}${b}`;
}
function detail([k,id]){
  const back=`<button class="back" data-back>‹ Back</button>`;
  if(k=='artist'){
    const a=A(id);if(!a){nav.pop();return home()}
    const ss=S.song.filter(s=>s.artistId==id);curList=ss;const als=S.album.filter(x=>x.artistId==id);
    return`${back}<div class="hd">${img(a.photo,a.name,'ci s140')}<h1>${esc(a.name)}</h1><div class="acts"><button class="btn sm" data-act="playall">Play</button><button class="btn sm alt" data-edit="artist:${id}">Edit</button></div></div>${a.story?`<h2>About</h2><p class="story">${esc(a.story)}</p>`:''}<h2>Songs</h2>${ss.map(row).join('')||'<p class="mut">No songs yet. Open a song’s ••• menu and pick this artist.</p>'}${als.length?`<h2>Albums</h2><div class="grid">${als.map(alcard).join('')}</div>`:''}`;
  }
  const al=AL(id);if(!al){nav.pop();return home()}
  const ss=S.song.filter(s=>s.albumId==id);curList=ss;
  return`${back}<div class="hd">${img(al.cover,al.title,'sq s140')}<h1>${esc(al.title)}</h1><span class="mut">${esc(A(al.artistId)?.name||'')}</span><div class="acts"><button class="btn sm" data-act="playall">Play</button><button class="btn sm alt" data-act="share:${id}">Share album</button><button class="btn sm alt" data-edit="album:${id}">Edit</button></div></div>${ss.map(row).join('')||'<p class="mut">No songs yet. Open a song’s ••• menu and pick this album.</p>'}`;
}
function view(){
  const top=nav[nav.length-1];
  $('#main').innerHTML=top?detail(top):tab=='home'?home():tab=='search'?search():library();
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==tab));
  drawMini();
}

/* editor */
function edit(kind,id){
  const o=id?S[kind].find(x=>x.id==id):{id:uid(),type:kind,added:Date.now()};
  const sel=(arr,key,val)=>`<option value="">None</option>`+arr.map(x=>`<option value="${x.id}" ${val==x.id?'selected':''}>${esc(x[key])}</option>`).join('')+`<option value="__new">+ New…</option>`;
  const F={song:[['title','Title'],['artistId','Artist','artist'],['albumId','Album','album'],['cover','Cover photo (leave empty to keep)','file'],['lyrics','Lyrics (plain text, or add [mm:ss] before lines to sync)','area']],artist:[['name','Name'],['story','Background story','area'],['photo','Photo (leave empty to keep)','file']],album:[['title','Title'],['artistId','Artist','artist'],['cover','Cover photo (leave empty to keep)','file']]}[kind];
  const f=F.map(([k,l,t])=>`<label>${l}</label>`+(t=='area'?`<textarea data-k="${k}">${esc(o[k])}</textarea>`:t=='file'?`<input type="file" accept="image/*" data-k="${k}">`:t=='artist'?`<select data-k="${k}">${sel(S.artist,'name',o[k])}</select>`:t=='album'?`<select data-k="${k}">${sel(S.album,'title',o[k])}</select>`:`<input data-k="${k}" value="${esc(o[k])}">`)).join('');
  const m=$('#modal');
  m.innerHTML=`<div class="sheet"><h2 style="margin-top:0">${id?'Edit':'New'} ${kind}</h2>${f}<div class="acts"><button class="del" data-m="del" ${id?'':'hidden'}>Delete</button><span><button class="btn alt" data-m="x">Cancel</button> <button class="btn" data-m="ok">Save</button></span></div></div>`;
  m.classList.add('open');
  m.querySelectorAll('select').forEach(sl=>sl.onchange=async()=>{

au.addEventListener('play',()=>{wake();drawMini();const p=$('#pp');if(p)p.textContent='❚❚'});
au.addEventListener('pause',()=>{drawMini();const p=$('#pp');if(p)p.textContent='▶'});
au.addEventListener('ended',()=>dj?djNext():next());
loop();

/* events */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-play],[data-go],[data-edit],[data-act],[data-back],[data-lib],[data-tab],[data-p]');
  if(t&&!t.closest('#modal')){
    const d=t.dataset;
    if(d.p){const p=d.p;if(p=='toggle'){e.stopPropagation();au.paused?(wake(),au.play()):au.pause()}else if(p=='next'){e.stopPropagation();next()}else if(p=='prev')prev();else if(p=='close')$('#full').classList.remove('open');else if(p=='share')lyricCard();else if(p=='dj')toggleDJ();return}
    if(d.edit){const[k,id]=d.edit.split(':');edit(k,id);return}
    if(d.play){const i=curList.findIndex(s=>s.id==d.play);play(curList,i<0?0:i);return}
    if(d.go){nav.push(d.go.split(':'));view();scrollTo(0,0);return}
    if(d.back){nav.pop();view();return}
    if(d.lib){lib=d.lib;view();return}
    if(d.tab){tab=d.tab;nav=[];view();scrollTo(0,0);return}
    if(d.act){const a=d.act;if(a=='import')$('#imp').click();else if(a=='newartist')edit('artist');else if(a=='newalbum')edit('album');else if(a=='playall'){if(curList.length)play(curList,0);else toast('No songs here yet')}else if(a.startsWith('share:'))shareAlbum(a.slice(6));return}
  }
  if(e.target.closest('#mini')&&Q.length){drawFull();$('#full').classList.add('open')}
});
document.addEventListener('input',e=>{if(e.target.id=='q')$('#res').innerHTML=results(e.target.value)});
$('#imp').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)importFiles(f)};
(async()=>{
  try{db=await idb();const items=await all();items.forEach(i=>S[i.type]?.push(i))}catch{toast('Storage is unavailable, songs won’t be kept')}
  view();
  const lp=[...S.song].sort((a,b)=>(PL[b.id]||0)-(PL[a.id]||0))[0];
  if(lp&&PL[lp.id]){Q=[...S.song];qi=Q.indexOf(lp);au.src=url(lp.audio);parseLy(lp);drawMini();setPal(cov(lp))}
})();
</script>
<script>if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));try{navigator.storage?.persist?.()}catch{}</script>
</body>
</html>
